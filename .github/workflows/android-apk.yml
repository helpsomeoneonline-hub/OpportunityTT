name: Build OpportunityTT Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate imported classifieds data
        run: python3 android/scripts/validate_jobs.py
      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/OpportunityTT-v0.2.0-debug.apk
          sha256sum dist/OpportunityTT-v0.2.0-debug.apk
      - name: Retain build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpportunityTT-v0.2.0-debug
          path: dist/OpportunityTT-v0.2.0-debug.apk
          if-no-files-found: error
      - name: Publish downloadable test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: OpportunityTT v0.2.0 (offline demonstration)
          body: |
            17 October 2026 Trinidad Express classifieds: 97 job positions with publication page and advertised contacts.
            Advertiser identity, vacancy status and ambiguous scan details are not independently verified.
            Offline candidate profiles, matching and locally saved employer drafts; no backend or real applicant directory.
            Note: this is a debug-signed test build.
          prerelease: true
          files: dist/OpportunityTT-v0.2.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
